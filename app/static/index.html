<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><title>Learning Path Agent</title></head>
<body style="font-family:system-ui;max-width:800px;margin:2rem auto">
<h1>Personalized Learning Path</h1>
<input id="goal" style="width:100%" value="Master ML deployment basics"/>
<button id="go">Build roadmap</button>
<pre id="out"></pre>
<script>
const b=location.origin.replace(/\/ui\/?$/,'');
document.getElementById('go').onclick=async()=>{
  const body={goal:document.getElementById('goal').value,user_id:'demo-user'};
  const r=await fetch(b+'/v1/roadmap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
};
</script>
</body>
</html>
