name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ml-core @ git+https://github.com/milos-plavsic/ml-core.git@v1.0.0"
          pip install "agent-core @ git+https://github.com/milos-plavsic/agent-core.git@v1.2.1"
          pip install -r requirements.txt
          pip install "langgraph==0.0.32" "langchain-core==0.1.45" --force-reinstall
      - name: Run tests
        run: python -m pytest -q
      - name: Analysis report (smoke)
        run: python -m analysis
